name: daily

# Every morning before the day-ahead market closes (12:30 Turkish time): update the data,
# forecast tomorrow, keep the forecast for the live scoreboard, and publish the dashboard.
on:
  schedule:
    - cron: "30 6 * * *" # 09:30 in Türkiye (UTC+3)
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: daily
  cancel-in-progress: false

jobs:
  forecast:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install ".[model]"

      # Raw history (~20 MB of parquet) lives in the Actions cache, not in git: each run
      # restores the latest copy and saves an updated one.
      - uses: actions/cache/restore@v4
        with:
          path: data/raw
          key: raw-${{ github.run_id }}
          restore-keys: raw-

      - name: Forecast tomorrow
        env:
          EPIAS_USERNAME: ${{ secrets.EPIAS_USERNAME }}
          EPIAS_PASSWORD: ${{ secrets.EPIAS_PASSWORD }}
        run: |
          python -m puant.data --only --weather   # weather first: a cold cache needs the most
          python -m puant.live

      - uses: actions/cache/save@v4
        if: always()
        with:
          path: data/raw
          key: raw-${{ github.run_id }}

      - name: Keep the forecast for the live scoreboard
        run: |
          git config user.name "puant-bot"
          git config user.email "puant-bot@users.noreply.github.com"
          git add data/forecasts
          git diff --cached --quiet || git commit -m "Forecast for $(ls data/forecasts | tail -1 | cut -d. -f1)"
          git push

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
