name: ci

on:
  push:
    branches: [main]
    paths-ignore: ["data/forecasts/**"]
  pull_request:

jobs:
  lint-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[model,dev]"
      - name: Ruff
        run: |
          ruff check .
          ruff format --check .
      - name: Pytest (offline)
        run: pytest -q
