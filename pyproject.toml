[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "puant"
version = "0.1.0"
description = "Day-ahead forecasts for the Turkish electricity market: price, demand, wind and solar, with explanations, scenarios and their value in money."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Emir Tunali" }]
keywords = ["electricity price forecasting", "probabilistic forecasting", "quantile regression",
            "turkey", "epias", "energy", "shapley", "battery arbitrage", "carbon intensity"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering",
]

dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "pyarrow>=14",
    "requests>=2.31",
    "holidays>=0.50",
]

[project.urls]
Dashboard = "https://emrtunali.github.io/puant/"
Source = "https://github.com/emrtunali/puant"

[project.optional-dependencies]
model = ["scikit-learn>=1.4", "scipy>=1.10"]
osm = ["osmium>=4.0"]
dev = ["pytest>=7", "ruff>=0.5"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
puant = ["data/*.json"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["network: needs internet and EPİAŞ credentials"]
addopts = "-m 'not network'"
